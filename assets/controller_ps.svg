<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#283048"/>
      <stop offset="0.5" stop-color="#1e2333"/>
      <stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="trig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323a52"/>
      <stop offset="1" stop-color="#191e2c"/>
    </linearGradient>
    <linearGradient id="bump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4360"/>
      <stop offset="1" stop-color="#212738"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.36" cy="0.30" r="1">
      <stop offset="0" stop-color="#4a5266"/>
      <stop offset="0.6" stop-color="#2c3140"/>
      <stop offset="1" stop-color="#1b1f28"/>
    </radialGradient>
    <radialGradient id="bevel" cx="0.35" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="well" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#0b0d13"/>
      <stop offset="0.85" stop-color="#10131b"/>
      <stop offset="1" stop-color="#232c44"/>
    </radialGradient>
    <linearGradient id="touch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20263a"/>
      <stop offset="1" stop-color="#151928"/>
    </linearGradient>
  </defs>

  <!-- triggers -->
  <rect x="86" y="8" width="40" height="20" rx="8" transform="rotate(-9 106 18)" fill="url(#trig)" stroke="#3a4360" stroke-width="1"/>
  <text x="106" y="21.5" transform="rotate(-9 106 18)" text-anchor="middle" fill="#8b93a7" font-family="Segoe UI, sans-serif" font-weight="600" font-size="9">L2</text>
  <rect x="274" y="8" width="40" height="20" rx="8" transform="rotate(9 294 18)" fill="url(#trig)" stroke="#3a4360" stroke-width="1"/>
  <text x="294" y="21.5" transform="rotate(9 294 18)" text-anchor="middle" fill="#8b93a7" font-family="Segoe UI, sans-serif" font-weight="600" font-size="9">R2</text>

  <!-- bumpers -->
  <rect x="72" y="34" width="80" height="16" rx="8" transform="rotate(-7 112 42)" fill="url(#bump)" stroke="#3a4360" stroke-width="1"/>
  <text x="112" y="45.5" transform="rotate(-7 112 42)" text-anchor="middle" fill="#9aa2b5" font-family="Segoe UI, sans-serif" font-weight="600" font-size="9">L1</text>
  <rect x="248" y="34" width="80" height="16" rx="8" transform="rotate(7 288 42)" fill="url(#bump)" stroke="#3a4360" stroke-width="1"/>
  <text x="288" y="45.5" transform="rotate(7 288 42)" text-anchor="middle" fill="#9aa2b5" font-family="Segoe UI, sans-serif" font-weight="600" font-size="9">R1</text>

  <!-- body -->
  <path d="M 100 58
           C 135 50 265 50 300 58
           C 345 64 372 100 378 148
           C 383 190 368 222 340 224
           C 316 226 300 198 288 184
           C 276 170 258 164 200 164
           C 142 164 124 170 112 184
           C 100 198 84 226 60 224
           C 32 222 17 190 22 148
           C 28 100 55 64 100 58 Z"
        fill="url(#body)" stroke="#3a4360" stroke-width="1.5"/>
  <path d="M 104 62 C 138 55 262 55 296 62 C 320 66 336 78 344 96
           C 300 84 240 78 200 78 C 160 78 100 84 56 96
           C 64 78 80 66 104 62 Z" fill="#ffffff" opacity="0.035"/>

  <!-- touchpad -->
  <rect x="163" y="60" width="74" height="34" rx="9" fill="url(#touch)" stroke="#3a4360" stroke-width="1"/>
  <rect x="165" y="62" width="70" height="6" rx="3" fill="#ffffff" opacity="0.03"/>

  <!-- share / options -->
  <rect x="149" y="64" width="8" height="16" rx="4" fill="url(#trig)" stroke="#3a4360"/>
  <rect x="243" y="64" width="8" height="16" rx="4" fill="url(#trig)" stroke="#3a4360"/>

  <!-- ps home -->
  <circle cx="200" cy="128" r="8.5" fill="url(#trig)" stroke="#3a4360"/>
  <circle cx="200" cy="128" r="8.5" fill="url(#bevel)"/>

  <!-- dpad: four spaced PS-style segments around an open center -->
  <circle cx="115" cy="100" r="34" fill="url(#well)" stroke="#3a4360" stroke-width="1"/>
  <rect x="106" y="71" width="18" height="20" rx="4" fill="url(#trig)" stroke="#3a4360"/>
  <path d="M 115 77 l 4.5 7 h -9 Z" fill="#59637a"/>
  <rect x="106" y="109" width="18" height="20" rx="4" fill="url(#trig)" stroke="#3a4360"/>
  <path d="M 115 123 l 4.5 -7 h -9 Z" fill="#59637a"/>
  <rect x="85" y="91" width="20" height="18" rx="4" fill="url(#trig)" stroke="#3a4360"/>
  <path d="M 91 100 l 7 -4.5 v 9 Z" fill="#59637a"/>
  <rect x="125" y="91" width="20" height="18" rx="4" fill="url(#trig)" stroke="#3a4360"/>
  <path d="M 139 100 l -7 -4.5 v 9 Z" fill="#59637a"/>

  <!-- shape buttons: triangle / circle / cross / square -->
  <circle cx="285" cy="100" r="34" fill="url(#well)" stroke="#3a4360" stroke-width="1" opacity="0.55"/>
  <circle cx="285" cy="75" r="12.5" fill="#171c28" stroke="#40e2a0" stroke-width="1.4"/>
  <circle cx="285" cy="75" r="12.5" fill="url(#bevel)"/>
  <path d="M 285 69 l 6.2 11 h -12.4 Z" fill="none" stroke="#40e2a0" stroke-width="1.9" stroke-linejoin="round"/>
  <circle cx="310" cy="100" r="12.5" fill="#171c28" stroke="#ff6b81" stroke-width="1.4"/>
  <circle cx="310" cy="100" r="12.5" fill="url(#bevel)"/>
  <circle cx="310" cy="100" r="5.8" fill="none" stroke="#ff6b81" stroke-width="1.9"/>
  <circle cx="285" cy="125" r="12.5" fill="#171c28" stroke="#7da2ff" stroke-width="1.4"/>
  <circle cx="285" cy="125" r="12.5" fill="url(#bevel)"/>
  <path d="M 279.8 119.8 l 10.4 10.4 M 290.2 119.8 l -10.4 10.4" stroke="#7da2ff" stroke-width="1.9" stroke-linecap="round"/>
  <circle cx="260" cy="100" r="12.5" fill="#171c28" stroke="#ff8cc8" stroke-width="1.4"/>
  <circle cx="260" cy="100" r="12.5" fill="url(#bevel)"/>
  <rect x="254.8" y="94.8" width="10.4" height="10.4" rx="1.5" fill="none" stroke="#ff8cc8" stroke-width="1.9"/>

  <!-- symmetric sticks -->
  <circle cx="162" cy="152" r="26" fill="url(#well)" stroke="#3a4360" stroke-width="1"/>
  <ellipse cx="162" cy="156" rx="18" ry="16" fill="#07090d"/>
  <circle cx="162" cy="152" r="17" fill="url(#cap)"/>
  <circle cx="162" cy="152" r="12" fill="none" stroke="#141821" stroke-width="1.5"/>
  <ellipse cx="157.5" cy="144.5" rx="9" ry="5.5" fill="#ffffff" opacity="0.08"/>
  <circle cx="238" cy="152" r="26" fill="url(#well)" stroke="#3a4360" stroke-width="1"/>
  <ellipse cx="238" cy="156" rx="18" ry="16" fill="#07090d"/>
  <circle cx="238" cy="152" r="17" fill="url(#cap)"/>
  <circle cx="238" cy="152" r="12" fill="none" stroke="#141821" stroke-width="1.5"/>
  <ellipse cx="233.5" cy="144.5" rx="9" ry="5.5" fill="#ffffff" opacity="0.08"/>
</svg>
