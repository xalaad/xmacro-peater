<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3040"/>
      <stop offset="0.5" stop-color="#20242f"/>
      <stop offset="1" stop-color="#161922"/>
    </linearGradient>
    <linearGradient id="trig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333a4c"/>
      <stop offset="1" stop-color="#1a1e28"/>
    </linearGradient>
    <linearGradient id="bump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4254"/>
      <stop offset="1" stop-color="#222735"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.36" cy="0.30" r="1">
      <stop offset="0" stop-color="#4a5266"/>
      <stop offset="0.6" stop-color="#2c3140"/>
      <stop offset="1" stop-color="#1b1f28"/>
    </radialGradient>
    <radialGradient id="bevel" cx="0.35" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="well" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#0b0d13"/>
      <stop offset="0.85" stop-color="#10131b"/>
      <stop offset="1" stop-color="#232836"/>
    </radialGradient>
    <radialGradient id="nexus" cx="0.36" cy="0.30" r="1">
      <stop offset="0" stop-color="#25a53d"/>
      <stop offset="1" stop-color="#0c4d18"/>
    </radialGradient>
  </defs>

  <!-- triggers -->
  <rect x="86" y="8" width="40" height="20" rx="8" transform="rotate(-9 106 18)" fill="url(#trig)" stroke="#3a4254" stroke-width="1"/>
  <text x="106" y="21.5" transform="rotate(-9 106 18)" text-anchor="middle" fill="#8b93a7" font-family="Segoe UI, sans-serif" font-weight="600" font-size="9">LT</text>
  <rect x="274" y="8" width="40" height="20" rx="8" transform="rotate(9 294 18)" fill="url(#trig)" stroke="#3a4254" stroke-width="1"/>
  <text x="294" y="21.5" transform="rotate(9 294 18)" text-anchor="middle" fill="#8b93a7" font-family="Segoe UI, sans-serif" font-weight="600" font-size="9">RT</text>

  <!-- bumpers -->
  <rect x="72" y="34" width="80" height="16" rx="8" transform="rotate(-7 112 42)" fill="url(#bump)" stroke="#3a4254" stroke-width="1"/>
  <text x="112" y="45.5" transform="rotate(-7 112 42)" text-anchor="middle" fill="#9aa2b5" font-family="Segoe UI, sans-serif" font-weight="600" font-size="9">LB</text>
  <rect x="248" y="34" width="80" height="16" rx="8" transform="rotate(7 288 42)" fill="url(#bump)" stroke="#3a4254" stroke-width="1"/>
  <text x="288" y="45.5" transform="rotate(7 288 42)" text-anchor="middle" fill="#9aa2b5" font-family="Segoe UI, sans-serif" font-weight="600" font-size="9">RB</text>

  <!-- body -->
  <path d="M 100 58
           C 135 50 265 50 300 58
           C 345 64 372 100 378 148
           C 383 190 368 222 340 224
           C 316 226 300 198 288 184
           C 276 170 258 164 200 164
           C 142 164 124 170 112 184
           C 100 198 84 226 60 224
           C 32 222 17 190 22 148
           C 28 100 55 64 100 58 Z"
        fill="url(#body)" stroke="#3a4254" stroke-width="1.5"/>
  <!-- top sheen -->
  <path d="M 104 62 C 138 55 262 55 296 62 C 320 66 336 78 344 96
           C 300 84 240 78 200 78 C 160 78 100 84 56 96
           C 64 78 80 66 104 62 Z" fill="#ffffff" opacity="0.035"/>

  <!-- nexus -->
  <circle cx="200" cy="74" r="11" fill="url(#nexus)" stroke="#1a1e28" stroke-width="1.5"/>
  <circle cx="200" cy="74" r="11" fill="url(#bevel)"/>

  <!-- left stick -->
  <circle cx="115" cy="100" r="28" fill="url(#well)" stroke="#3a4254" stroke-width="1"/>
  <ellipse cx="115" cy="104" rx="19" ry="17" fill="#07090d"/>
  <circle cx="115" cy="100" r="18" fill="url(#cap)"/>
  <circle cx="115" cy="100" r="13" fill="none" stroke="#141821" stroke-width="1.5"/>
  <ellipse cx="110" cy="92" rx="10" ry="6" fill="#ffffff" opacity="0.08"/>

  <!-- right stick -->
  <circle cx="250" cy="150" r="28" fill="url(#well)" stroke="#3a4254" stroke-width="1"/>
  <ellipse cx="250" cy="154" rx="19" ry="17" fill="#07090d"/>
  <circle cx="250" cy="150" r="18" fill="url(#cap)"/>
  <circle cx="250" cy="150" r="13" fill="none" stroke="#141821" stroke-width="1.5"/>
  <ellipse cx="245" cy="142" rx="10" ry="6" fill="#ffffff" opacity="0.08"/>

  <!-- dpad -->
  <circle cx="150" cy="150" r="26" fill="url(#well)" stroke="#3a4254" stroke-width="1"/>
  <path d="M 142 128 h 16 a3 3 0 0 1 3 3 v 8 h 8 a3 3 0 0 1 3 3 v 16 a3 3 0 0 1 -3 3 h -8 v 8 a3 3 0 0 1 -3 3 h -16 a3 3 0 0 1 -3 -3 v -8 h -8 a3 3 0 0 1 -3 -3 v -16 a3 3 0 0 1 3 -3 h 8 v -8 a3 3 0 0 1 3 -3 Z"
        fill="url(#trig)" stroke="#3a4254" stroke-width="1"/>
  <circle cx="150" cy="150" r="6" fill="#12151d"/>
  <path d="M 150 134 l 4 6 h -8 Z M 150 166 l 4 -6 h -8 Z M 134 150 l 6 -4 v 8 Z M 166 150 l -6 -4 v 8 Z" fill="#59637a"/>

  <!-- ABXY -->
  <circle cx="285" cy="124" r="12.5" fill="#182a1f" stroke="#3ddc84" stroke-width="1.4"/>
  <circle cx="285" cy="124" r="12.5" fill="url(#bevel)"/>
  <text x="285" y="128.5" text-anchor="middle" fill="#4ff09a" font-family="Segoe UI, sans-serif" font-weight="700" font-size="12">A</text>
  <circle cx="311" cy="100" r="12.5" fill="#2d1a20" stroke="#ff5470" stroke-width="1.4"/>
  <circle cx="311" cy="100" r="12.5" fill="url(#bevel)"/>
  <text x="311" y="104.5" text-anchor="middle" fill="#ff6b84" font-family="Segoe UI, sans-serif" font-weight="700" font-size="12">B</text>
  <circle cx="259" cy="100" r="12.5" fill="#18222e" stroke="#4cc2ff" stroke-width="1.4"/>
  <circle cx="259" cy="100" r="12.5" fill="url(#bevel)"/>
  <text x="259" y="104.5" text-anchor="middle" fill="#63cbff" font-family="Segoe UI, sans-serif" font-weight="700" font-size="12">X</text>
  <circle cx="285" cy="76" r="12.5" fill="#2c2517" stroke="#ffb454" stroke-width="1.4"/>
  <circle cx="285" cy="76" r="12.5" fill="url(#bevel)"/>
  <text x="285" y="80.5" text-anchor="middle" fill="#ffc06b" font-family="Segoe UI, sans-serif" font-weight="700" font-size="12">Y</text>

  <!-- view / menu -->
  <circle cx="176" cy="104" r="7.5" fill="url(#trig)" stroke="#3a4254"/>
  <circle cx="176" cy="104" r="7.5" fill="url(#bevel)"/>
  <circle cx="224" cy="104" r="7.5" fill="url(#trig)" stroke="#3a4254"/>
  <circle cx="224" cy="104" r="7.5" fill="url(#bevel)"/>
  <path d="M 221 101.5 h 6 M 221 104 h 6 M 221 106.5 h 6" stroke="#707a90" stroke-width="1"/>
  <rect x="172.5" y="100.5" width="5" height="5" fill="none" stroke="#707a90" stroke-width="1"/>
  <rect x="174.5" y="102.5" width="5" height="5" fill="none" stroke="#707a90" stroke-width="1"/>
</svg>
