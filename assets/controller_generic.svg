<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f39"/>
      <stop offset="0.5" stop-color="#20232b"/>
      <stop offset="1" stop-color="#15171d"/>
    </linearGradient>
    <linearGradient id="trig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343945"/>
      <stop offset="1" stop-color="#1b1e25"/>
    </linearGradient>
    <linearGradient id="bump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c414f"/>
      <stop offset="1" stop-color="#232730"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.36" cy="0.30" r="1">
      <stop offset="0" stop-color="#4a5060"/>
      <stop offset="0.6" stop-color="#2c303a"/>
      <stop offset="1" stop-color="#1b1e25"/>
    </radialGradient>
    <radialGradient id="bevel" cx="0.35" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="well" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#0b0d11"/>
      <stop offset="0.85" stop-color="#101318"/>
      <stop offset="1" stop-color="#242832"/>
    </radialGradient>
  </defs>

  <rect x="86" y="8" width="40" height="20" rx="8" transform="rotate(-9 106 18)" fill="url(#trig)" stroke="#3c414f" stroke-width="1"/>
