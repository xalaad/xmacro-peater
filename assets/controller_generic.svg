  <rect x="72" y="34" width="80" height="16" rx="8" transform="rotate(-7 112 42)" fill="url(#bump)" stroke="#3c414f" stroke-width="1"/>
  <text x="112" y="45.5" transform="rotate(-7 112 42)" text-anchor="middle" fill="#9aa2b5" font-family="Segoe UI, sans-serif" font-weight="600" font-size="9">L1</text>
  <rect x="248" y="34" width="80" height="16" rx="8" transform="rotate(7 288 42)" fill="url(#bump)" stroke="#3c414f" stroke-width="1"/>
